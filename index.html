<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ALTITUDE — Lâm Vũ An</title>
    <meta name="description" content="ALTITUDE: the portfolio of Lâm Vũ An (Chadd Lam), flown as one continuous flight. Airline commercial strategy, digital humanities and accessibility technology." />
    <meta name="theme-color" content="#3A0F34" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ALTITUDE — Lâm Vũ An" />
    <meta property="og:description" content="Beyond the Ordinary. Connecting Ideas, People & Possibilities." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og.jpg" />
    <style>
      html { background: #e5e4e2; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint, replaced by React. Mirrors the loader and the hero headline. -->
      <div class="loader on-dark" id="static-loader">
        <div class="loader-mark">ALTITUDE</div>
        <div class="loader-route" aria-hidden="true"><span style="transform: scaleX(0)"></span></div>
        <div class="loader-pct mono"><span>Pre-flight</span><span>000%</span></div>
      </div>
      <div class="scene-layer" aria-hidden="true">
        <picture>
          <source media="(max-aspect-ratio: 9/10)" srcset="/posters/gate-m.webp" />
          <img class="scene-poster" src="/posters/gate-d.webp" alt="" fetchpriority="high" />
        </picture>
      </div>
      <section class="gl-still-hero">
        <div class="hero-box">
          <h1 class="hero-h1 display"><span class="hero-l1">BEYOND</span> <span class="hero-l2">THE ORDINARY.</span></h1>
        </div>
        <div class="hero-box hero-front">
          <div class="hero-copy">
            <p class="hero-support serif">I work where airline commercial strategy, digital humanities, and accessibility technology meet.</p>
            <p class="hero-identity">
              <span class="hero-name display" lang="vi">Lâm Vũ An</span>
              <span class="hero-alias mono">Chadd Lam</span>
              <span class="hero-dims">Aviation &amp; Business | Technology &amp; Innovation | Culture &amp; Social Impact</span>
            </p>
          </div>
        </div>
      </section>
    </div>
    <script>
      // Returning visitors in the same session skip the pre-flight screen.
      try {
        if (sessionStorage.getItem('altitude-boarded') === '1') document.getElementById('static-loader').remove();
      } catch (e) {}
    </script>
    <noscript>
      <div style="font-family: Georgia, serif; color: #3a0f34; max-width: 640px; margin: 15vh auto; padding: 0 24px">
        <h1>ALTITUDE — Lâm Vũ An</h1>
        <p>I work where airline commercial strategy, digital humanities, and accessibility technology meet.</p>
        <p>This site needs JavaScript. Contact: <a href="mailto:lamvuan02@gmail.com">lamvuan02@gmail.com</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
